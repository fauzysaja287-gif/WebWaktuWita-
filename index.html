<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam Digital & Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Digital Clock</h1>
            <p>Jam Digital & Stopwatch</p>
        </header>

        <!-- JAM DIGITAL -->
        <section class="card">
            <h2>Jam Digital</h2>

            <div id="clock">00:00:00</div>

            <div id="date">
                Memuat tanggal...
            </div>

            <p class="timezone">
                Waktu Indonesia Tengah (WITA)
            </p>
        </section>

        <!-- STOPWATCH -->
        <section class="card">
            <h2>Stopwatch</h2>

            <div id="stopwatch">00:00:00</div>

            <div class="buttons">
                <button id="startBtn" class="start">
                    Mulai
                </button>

                <button id="pauseBtn" class="pause">
                    Jeda
                </button>

                <button id="resetBtn" class="reset">
                    Reset
                </button>
            </div>
        </section>

        <footer>
            <p>© 2026 Digital Clock | WITA</p>
        </footer>

    </div>

   <script src="script.js"></script>
</html>
